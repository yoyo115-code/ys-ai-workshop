name: CI

on:
  push:
    branches: [main, "feat/**", "refactor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: workshop_test
          POSTGRES_DB: workshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshop -d workshop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TEST_POSTGRES_URL: postgresql+psycopg://workshop:workshop_test@127.0.0.1:5432/workshop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: PostgreSQL migration
        run: |
          cd backend
          APP_ENV=test DATABASE_URL="$TEST_POSTGRES_URL" alembic upgrade head
      - name: Full backend suite with PostgreSQL integration
        run: PYTHONPATH=backend python -m unittest discover -s tests/backend -v
      - name: Python syntax
        run: python -m compileall -q backend/app backend/alembic tests/backend
      - name: Frontend syntax
        run: |
          node --check frontend/assets/js/config.js
          node --check frontend/assets/js/app.js
      - name: Browser acceptance
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
          cd backend
          APP_ENV=test DATABASE_URL=sqlite:////tmp/ys-ai-browser-ci.db RESUME_EXPORT_DIR=/tmp/ys-ai-browser-ci-exports REGISTRATION_MODE=invite_only SESSION_SECRET=synthetic-ci-session-secret-1234567890 uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          cd ..
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/health/live", timeout=1)
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("Browser test server did not become ready")
          PY
          YS_AI_E2E_BASE_URL=http://127.0.0.1:8000 python -m unittest tests.browser.test_frontend_delivery_e2e -v
      - name: Tracked artifact safety
        run: |
          ! git ls-files | grep -E '(^|/)(\.env$|platform\.db$|node_modules/|\.venv/|__pycache__/)|\.(docx|pdf)$'

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag ys-ai-workshop:ci .
